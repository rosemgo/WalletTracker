# Configurazione principale dell'applicazione.
# La sintassi ${NOME:valore} significa: "usa la variabile NOME, se non esiste usa valore".

spring:
  application:
    name: wallettracker
  config:
    # Legge le variabili dal file .env (lo stesso file che userà Docker Compose più avanti).
    # "optional:" = se il file non esiste non è un errore. Cerchiamo sia nella cartella
    # corrente sia in quella superiore, così funziona avviando l'app da backend/ o dalla radice.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # Connessione al database PostgreSQL avviato con Docker Compose (stessi valori del .env).
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:wallettracker}
    username: ${POSTGRES_USER:wallettracker}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    hibernate:
      # Le tabelle le crea Flyway, non Hibernate. "validate" fa solo un controllo all'avvio:
      # se le classi @Entity non corrispondono alle tabelle, l'applicazione non parte.
      ddl-auto: validate

enable-banking:
  base-url: https://api.enablebanking.com
  application-id: ${ENABLE_BANKING_APP_ID:}
  private-key-path: ${ENABLE_BANKING_PRIVATE_KEY_PATH:../secrets/enable-banking.pem}
  redirect-url: ${ENABLE_BANKING_REDIRECT_URL:https://localhost:8443/callback}

# Sincronizzazione automatica (Fase 1, passo 5): vedi SyncProperties e docs/08.
wallettracker:
  sync:
    enabled: true
    # Ogni conto viene aggiornato al massimo ogni 6 ore: 4 letture al giorno, il limite PSD2 in background.
    interval: ${SYNC_INTERVAL:6h}
    # Ogni 30 minuti si controlla se c'è un conto da aggiornare (costa solo una lettura del database).
    check-every: 30m
    initial-delay: 10s
