# Configurazione principale dell'applicazione.
# La sintassi ${NOME:valore} significa: "usa la variabile NOME, se non esiste usa valore".

spring:
  application:
    name: wallettracker
  config:
    # Legge le variabili dal file .env (lo stesso file che userà Docker Compose più avanti).
    # "optional:" = se il file non esiste non è un errore. Cerchiamo sia nella cartella
    # corrente sia in quella superiore, così funziona avviando l'app da backend/ o dalla radice.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # Spring AI (passo 7b): dove trovare Ollama. È configurazione dell'installazione (con Docker Compose sarà
  # l'indirizzo del container); se l'IA usarla o no lo decide l'utente dalle Impostazioni (tabella ai_settings).
  # Il modello scelto dall'utente lo passiamo a ogni richiesta, quindi qui non serve.
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}

  # I file caricati dalla dashboard (importazione CSV): al massimo 5 MB, un estratto conto di anni.
  # Un limite basso protegge il server da file enormi, per errore o apposta.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Connessione al database PostgreSQL avviato con Docker Compose (stessi valori del .env).
  # POSTGRES_HOST: avviando il backend a mano è "localhost"; nel container (Fase 4) è "db", il nome del servizio
  # nel docker-compose.yml, che la rete interna di Docker trasforma nell'indirizzo del container del database.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wallettracker}
    username: ${POSTGRES_USER:wallettracker}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    hibernate:
      # Le tabelle le crea Flyway, non Hibernate. "validate" fa solo un controllo all'avvio:
      # se le classi @Entity non corrispondono alle tabelle, l'applicazione non parte.
      ddl-auto: validate
    # Con il server web, Spring Boot terrebbe aperta la sessione del database per tutta la richiesta
    # HTTP ("open in view"): comodo, ma nasconde query fatte di nascosto. La spegniamo: i dati che
    # servono li carichiamo nei servizi, dentro le transazioni (vedi docs/09).
    open-in-view: false

  mvc:
    problemdetails:
      # Gli errori delle API (404, 400...) hanno un corpo JSON standard (RFC 9457), con il motivo in "detail".
      enabled: true

# Server web (Fase 2). Ascolta SOLO su questo PC (127.0.0.1): le API non hanno ancora un login, e
# senza questa riga chiunque sulla stessa rete Wi-Fi (a casa, in un bar...) potrebbe leggere i tuoi movimenti.
# Nel container (Fase 4) SERVER_ADDRESS è 0.0.0.0: dentro un container 127.0.0.1 è il container stesso, e nginx
# (un altro container) non arriverebbe al backend. Resta chiuso lo stesso: docker-compose.yml non pubblica la
# porta del backend, che si raggiunge solo dalla rete interna di Docker (vedi docs/44).
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  # nginx dice al backend con quale protocollo è arrivata la richiesta (X-Forwarded-Proto, docs/44 parte D3). Con
  # "native" Tomcat lo crede, ma solo se la richiesta arriva da un indirizzo interno (la rete di Docker): così, con
  # Tailscale e https (passo 4), il cookie della sessione prende da solo l'attributo Secure.
  forward-headers-strategy: native
  # La sessione aperta dal PIN (Fase 4, passo 3: docs/46, parte B).
  servlet:
    session:
      # Dopo 12 ore senza richieste la sessione si chiude, e l'app chiede di nuovo il PIN. Le sessioni stanno nella
      # memoria del backend: anche un riavvio (un aggiornamento) le chiude.
      timeout: 12h
      # La sessione si riconosce solo dal cookie, mai da un ";jsessionid=..." scritto negli indirizzi (finirebbe nella
      # cronologia, nei log, nei link copiati).
      tracking-modes: cookie
      cookie:
        name: WALLETTRACKER_SESSION
        # HttpOnly: il JavaScript della pagina non può leggerlo. Uno script infilato nella pagina non lo ruberebbe.
        http-only: true
        # SameSite=Strict: il browser non lo manda nelle richieste che partono da un altro sito (CSRF).
        same-site: strict
        # "Secure" (solo su https) non si scrive qui: Tomcat lo aggiunge da solo quando la richiesta è https. Su
        # http://localhost non ci sarebbe, e il browser non manderebbe il cookie.

# Actuator (Fase 4): solo /actuator/health, che dice se il backend e il database rispondono ("UP"). Lo usa il
# controllo di salute di Docker (healthcheck nel docker-compose.yml). Non passa da nginx, che inoltra solo /api/:
# da fuori non si raggiunge. I dettagli (quale controllo è fallito, lo spazio su disco) non si mostrano mai.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

enable-banking:
  base-url: https://api.enablebanking.com
  application-id: ${ENABLE_BANKING_APP_ID:}
  private-key-path: ${ENABLE_BANKING_PRIVATE_KEY_PATH:../secrets/enable-banking.pem}
  redirect-url: ${ENABLE_BANKING_REDIRECT_URL:https://localhost:8443/callback}

# Sincronizzazione automatica (Fase 1, passo 5): vedi SyncProperties e docs/08.
wallettracker:
  # I nomi con cui si può raggiungere il backend (header Host, e Origin per le richieste che modificano dati).
  # Protezione contro DNS rebinding e richieste da altri siti: vedi LocalOnlyRequestFilter e docs/17.
  # Con Tailscale (Fase 4) si aggiunge il nome del PC nella rete privata (es. pc-casa.esempio.ts.net).
  allowed-hosts: ${WALLETTRACKER_ALLOWED_HOSTS:localhost,127.0.0.1}
  encryption:
    # Il file con la chiave che cifra i segreti nel database (vedi SecretCipher e docs/17). Se non esiste viene
    # creato al primo avvio. Sta FUORI dal database, nella cartella .data/ (esclusa da Git): includilo nei
    # backup, ma separato dal backup del database.
    key-file: ${WALLETTRACKER_KEY_FILE:../.data/encryption.key}
  sync:
    enabled: true
    # Ogni conto viene aggiornato al massimo ogni 6 ore: 4 letture al giorno, il limite PSD2 in background.
    interval: ${SYNC_INTERVAL:6h}
    # Ogni 30 minuti si controlla se c'è un conto da aggiornare (costa solo una lettura del database).
    check-every: 30m
    initial-delay: 10s
  ai:
    # L'indirizzo di Gemini (passo 7c, docs/30). Si cambia solo per i test, che lo puntano a un server finto.
    # Vuoto = l'indirizzo di Google (lo sceglie la libreria di Google).
    gemini:
      base-url:
