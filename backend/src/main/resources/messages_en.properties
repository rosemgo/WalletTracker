# The sentences the backend sends to the dashboard, in English.
#
# Same codes as messages.properties (the base catalog, in Italian), which explains how a sentence is written
# (parameters, numbers, the apostrophe typed twice, singular and plural). A code missing here is read from there.
# MessageCatalogTest checks that the two files have the same codes and the same parameters.

