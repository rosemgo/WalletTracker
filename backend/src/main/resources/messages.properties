# Il catalogo delle frasi che il backend manda alla dashboard, in italiano.
#
# Nel codice Java non ci sono frasi: c'è il codice della frase (la parte prima di "=") con i suoi parametri, e
# accanto un commento con la frase. La frase vera è qui, ed è quella che vede l'utente (it.wallettracker.message).
#
# Questo è il file di base: vale per tutte le lingue che non hanno un file loro. Per aggiungere l'inglese basta un
# file messages_en.properties con gli stessi codici; quello che lì manca si legge da qui.
#
# Come si scrive una frase (è il formato MessageFormat di Java):
#   {0} {1}            i parametri, nell'ordine in cui il codice li passa
#   {0,number,#}       un numero intero scritto senza il punto delle migliaia (1000, non 1.000): per identificativi,
#                      righe, codici. Con il solo {0} un numero prende i separatori della lingua
#   ''                 l'apostrofo si scrive DUE volte (l''importo): uno solo, per MessageFormat, apre un testo
#                      "tra virgolette" e sparisce
#   {0,choice,1#un tentativo|1<{0} tentativi}
#                      singolare e plurale: "1#" vale per 1, "1<" per i numeri più grandi di 1. Dentro una scelta
#                      il numero si scrive {0}: "#" e "<" lì sono i segni della scelta
#
# Un test (MessageCatalogTest) controlla che ogni codice usato nel codice Java sia qui, e viceversa.

