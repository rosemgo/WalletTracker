# Impostazioni aggiuntive attive solo con il profilo "poc" (Fase 0).
# Togliamo il banner e i log informativi di Spring, così la console resta leggibile.

spring:
  main:
    banner-mode: off
    # Il programma della Fase 0 è a riga di comando: niente server web, così alla fine termina.
    web-application-type: none

logging:
  level:
    root: warn
    # Gli esiti delle importazioni li stampa già PocRunner: dalla sincronizzazione mostriamo solo
    # gli errori imprevisti.
    it.wallettracker.sync: error

wallettracker:
  sync:
    # Il programma della Fase 0 aggiorna i conti da solo, con te presente, e poi termina:
    # niente sincronizzazione automatica.
    enabled: false
