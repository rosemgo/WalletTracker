<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Come nasce un file di backup</text>
<text x="600" y="68" text-anchor="middle" font-size="15" fill="#475569">quattro file in un archivio, cifrato con la tua password: chi trova il file senza la password vede solo byte casuali</text>

<!-- sources -->
<rect x="20" y="100" width="300" height="130" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
<text x="170" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Il database (container db)</text>
<text x="40" y="158" font-size="13" fill="#334155">pg_dump --format=custom</text>
<text x="40" y="180" font-size="12" fill="#475569">una "fotografia" coerente, fatta</text>
<text x="40" y="198" font-size="12" fill="#475569">dentro una transazione: va bene</text>
<text x="40" y="216" font-size="12" fill="#475569">anche con l'app accesa</text>

<rect x="20" y="250" width="300" height="110" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
<text x="170" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#c2410c">.data/encryption.key</text>
<text x="40" y="308" font-size="12" fill="#475569">senza, i segreti cifrati nel database</text>
<text x="40" y="326" font-size="12" fill="#475569">(Enable Banking, Gemini) non si leggono</text>
<text x="40" y="344" font-size="12" fill="#475569">più: va salvata INSIEME al database</text>

<!-- work dir -->
<rect x="380" y="100" width="360" height="300" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="560" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Cartella di lavoro (/tmp, in memoria)</text>
<rect x="400" y="148" width="320" height="40" rx="8" fill="#ffffff" stroke="#4338ca"/>
<text x="415" y="173" font-size="13" font-family="Consolas, monospace" fill="#0f172a">database.dump</text>
<rect x="400" y="196" width="320" height="40" rx="8" fill="#ffffff" stroke="#c2410c"/>
<text x="415" y="221" font-size="13" font-family="Consolas, monospace" fill="#0f172a">encryption.key</text>
<rect x="400" y="244" width="320" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="415" y="266" font-size="13" font-family="Consolas, monospace" fill="#0f172a">manifest.txt</text>
<text x="415" y="288" font-size="11" fill="#475569">quando, che tipo, PostgreSQL, ultima migrazione</text>
<rect x="400" y="308" width="320" height="76" rx="8" fill="#ffffff" stroke="#15803d"/>
<text x="415" y="330" font-size="13" font-family="Consolas, monospace" fill="#0f172a">SHA256SUMS</text>
<text x="415" y="350" font-size="11" fill="#475569">l'impronta di ognuno dei tre file: al ripristino,</text>
<text x="415" y="368" font-size="11" fill="#475569">un solo byte cambiato e ce ne accorgiamo</text>

<line x1="320" y1="165" x2="395" y2="168" stroke="#334155" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="320" y1="300" x2="395" y2="216" stroke="#334155" stroke-width="2.5" marker-end="url(#ak)"/>

<!-- tar + openssl -->
<rect x="800" y="100" width="380" height="300" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
<text x="990" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">tar  |  openssl enc</text>
<text x="820" y="160" font-size="13" fill="#334155">① tar: i quattro file in un archivio solo</text>
<text x="820" y="190" font-size="13" fill="#334155">② openssl: dalla password alla chiave</text>
<text x="840" y="210" font-size="12" fill="#475569">PBKDF2-SHA256, 600 000 giri, un sale casuale</text>
<text x="840" y="228" font-size="12" fill="#475569">(lento apposta: rallenta chi prova password)</text>
<text x="820" y="258" font-size="13" fill="#334155">③ cifra con AES-256 mentre scrive</text>
<text x="820" y="288" font-size="13" fill="#334155">④ prima un nome provvisorio, poi</text>
<text x="840" y="308" font-size="12" fill="#475569">rinominato: un backup interrotto a metà</text>
<text x="840" y="326" font-size="12" fill="#475569">non sembra mai un backup buono</text>
<text x="820" y="360" font-size="12" font-family="Consolas, monospace" fill="#0f172a">-pass env:WALLETTRACKER_BACKUP_PASSWORD</text>
<text x="820" y="380" font-size="11" fill="#475569">(dal .env, attraverso docker-compose.yml)</text>

<line x1="740" y1="250" x2="795" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#ak)"/>

<!-- result -->
<rect x="200" y="440" width="800" height="150" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
<text x="600" y="472" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">backup/wallettracker-manuale-20261031-101500.backup</text>
<text x="600" y="500" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#0f172a">Salted__ ▒░▓▒░░▓▒▓░▒▒░▓░▒▓░▒░▓▒░▓▒░▓▒▓░▒▓░▒░▓▒░▓…</text>
<text x="600" y="528" text-anchor="middle" font-size="13" fill="#334155">"Salted__" e il sale all'inizio, poi solo byte casuali: niente movimenti, niente nomi, niente chiave in chiaro</text>
<text x="600" y="552" text-anchor="middle" font-size="13" fill="#334155">permessi 600 (solo il proprietario); escluso da Git; tipi: manuale, automatico, prima-del-ripristino</text>
<text x="600" y="576" text-anchor="middle" font-size="12" fill="#475569">il nome contiene data e ora: in ordine alfabetico, sono anche in ordine di tempo</text>
<line x1="990" y1="400" x2="900" y2="436" stroke="#334155" stroke-width="2.5" marker-end="url(#ak)"/>

<!-- bottom note -->
<rect x="20" y="620" width="1160" height="120" rx="12" fill="#fef2f2" stroke="#b91c1c"/>
<text x="600" y="650" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">La password è l'unica cosa che non sta nel backup</text>
<text x="600" y="676" text-anchor="middle" font-size="13" fill="#334155">Sta nel .env del server (serve al backup automatico di ogni notte) e DEVE stare anche fuori dal server, in un posto sicuro.</text>
<text x="600" y="698" text-anchor="middle" font-size="13" fill="#334155">Se il server si rompe e la password era solo lì, i backup non si aprono più: nessuno, nemmeno noi, li può decifrare.</text>
<text x="600" y="722" text-anchor="middle" font-size="13" fill="#334155">È il prezzo della cifratura vera.</text>
</svg>
