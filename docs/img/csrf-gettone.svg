<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
</defs>
<rect width="1200" height="900" fill="#ffffff"/>
<text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Il gettone CSRF: due cookie e un'intestazione</text>
<text x="600" y="68" text-anchor="middle" font-size="15" fill="#475569">i cookie il browser li aggiunge da solo, a chiunque faccia partire la richiesta; l'intestazione X-XSRF-TOKEN la scrive solo chi sa leggere il cookie</text>

<!-- browser -->
<rect x="20" y="90" width="1160" height="470" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="45" y="120" font-size="18" font-weight="700" fill="#334155">Il tuo browser</text>

<!-- cookie jar -->
<rect x="380" y="105" width="440" height="150" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="600" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Il barattolo dei cookie di localhost:8000</text>
<rect x="400" y="148" width="400" height="44" rx="8" fill="#ffffff" stroke="#b45309"/>
<text x="415" y="168" font-size="13" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">WALLETTRACKER_SESSION=8F3A…</text>
<text x="415" y="185" font-size="12" fill="#475569">chi sei · HttpOnly: nessun JavaScript lo legge</text>
<rect x="400" y="200" width="400" height="44" rx="8" fill="#ffffff" stroke="#b45309"/>
<text x="415" y="220" font-size="13" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">XSRF-TOKEN=8c1d…</text>
<text x="415" y="237" font-size="12" fill="#475569">il gettone · leggibile, ma solo dalle pagine di localhost:8000</text>

<!-- left tab: our page -->
<rect x="45" y="280" width="530" height="260" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="310" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Scheda 1: WalletTracker (localhost:8000)</text>
<text x="65" y="336" font-size="13" fill="#334155">1. Angular legge il cookie XSRF-TOKEN (stessa origine: può)</text>
<text x="65" y="360" font-size="13" fill="#334155">2. lo copia in un'intestazione e manda:</text>
<rect x="65" y="372" width="490" height="88" rx="8" fill="#ffffff" stroke="#15803d"/>
<text x="80" y="394" font-size="12" font-family="Consolas, monospace" fill="#0f172a">POST /api/categories</text>
<text x="80" y="414" font-size="12" font-family="Consolas, monospace" fill="#b45309">Cookie: WALLETTRACKER_SESSION=8F3A…; XSRF-TOKEN=8c1d…</text>
<text x="80" y="434" font-size="12" font-family="Consolas, monospace" font-weight="700" fill="#15803d">X-XSRF-TOKEN: 8c1d…</text>
<text x="80" y="452" font-size="11" fill="#475569">(i cookie li aggiunge il browser; l'intestazione la scrive Angular)</text>
<text x="65" y="488" font-size="13" fill="#334155">I cookie partono da soli, l'intestazione no:</text>
<text x="65" y="508" font-size="13" fill="#334155">è la prova che la richiesta viene dalle nostre pagine.</text>

<!-- right tab: evil -->
<rect x="625" y="280" width="530" height="260" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="890" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">Scheda 2: sito-cattivo.com</text>
<text x="645" y="336" font-size="13" fill="#334155">1. vorrebbe leggere XSRF-TOKEN: NON può</text>
<text x="663" y="354" font-size="12" fill="#475569">(un sito legge solo i cookie della sua origine)</text>
<text x="645" y="378" font-size="13" fill="#334155">2. fa partire comunque un modulo:</text>
<rect x="645" y="390" width="490" height="70" rx="8" fill="#ffffff" stroke="#b91c1c"/>
<text x="660" y="412" font-size="12" font-family="Consolas, monospace" fill="#0f172a">POST /api/categories/12/delete</text>
<text x="660" y="432" font-size="12" font-family="Consolas, monospace" fill="#b45309">Cookie: …  (forse: li aggiungerebbe il TUO browser)</text>
<text x="660" y="452" font-size="12" font-family="Consolas, monospace" font-weight="700" fill="#b91c1c">(nessun X-XSRF-TOKEN)</text>
<text x="645" y="488" font-size="13" fill="#334155">Anche se i cookie partissero (SameSite=Strict lo impedisce già),</text>
<text x="645" y="508" font-size="13" fill="#334155">l'intestazione mancherebbe: non sa il valore da scrivere.</text>

<!-- arrows down -->
<line x1="310" y1="540" x2="310" y2="615" stroke="#15803d" stroke-width="3" marker-end="url(#ag)"/>
<line x1="890" y1="540" x2="890" y2="615" stroke="#b91c1c" stroke-width="3" marker-end="url(#ar)"/>

<!-- backend -->
<rect x="20" y="620" width="1160" height="260" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
<text x="600" y="650" text-anchor="middle" font-size="18" font-weight="700" fill="#c2410c">Backend: CsrfFilter (il quinto filtro della catena), per POST, PUT, PATCH, DELETE</text>
<text x="600" y="674" text-anchor="middle" font-size="14" fill="#334155">confronta il valore del cookie XSRF-TOKEN con quello dell'intestazione X-XSRF-TOKEN: non si ricorda niente, confronta e basta</text>

<rect x="60" y="695" width="500" height="160" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="310" y="725" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">8c1d… = 8c1d…  →  uguali</text>
<text x="310" y="752" text-anchor="middle" font-size="13" fill="#334155">la richiesta prosegue: PinAccessFilter,</text>
<text x="310" y="772" text-anchor="middle" font-size="13" fill="#334155">AuthorizationFilter, il controller</text>
<text x="310" y="810" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">✓ eseguita</text>

<rect x="640" y="695" width="500" height="160" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="890" y="725" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">8c1d… ≠ (niente)  →  mancante</text>
<text x="890" y="752" text-anchor="middle" font-size="13" fill="#334155">si ferma qui, prima di arrivare al controller</text>
<text x="890" y="772" text-anchor="middle" font-size="13" fill="#334155">"Richiesta rifiutata: ricarica la pagina e riprova."</text>
<text x="890" y="810" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">✗ 403</text>

</svg>
