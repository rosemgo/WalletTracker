<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
</defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Due chiavi, due compiti: una scatola dentro l'altra</text>
<text x="600" y="68" text-anchor="middle" font-size="15" fill="#475569">la chiave dei segreti è un file; la chiave dei backup non è salvata da nessuna parte: si ricalcola dalla tua password</text>

<!-- password -> key -->
<rect x="20" y="100" width="330" height="250" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
<text x="185" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">La password dei backup</text>
<text x="40" y="160" font-size="12" fill="#334155">WALLETTRACKER_BACKUP_PASSWORD nel .env</text>
<text x="40" y="180" font-size="12" fill="#334155">(e nel tuo gestore di password)</text>
<text x="40" y="214" font-size="13" fill="#334155">+ il sale (8 byte casuali, scritti</text>
<text x="40" y="232" font-size="13" fill="#334155">all'inizio del file, dopo "Salted__")</text>
<text x="40" y="264" font-size="13" font-weight="700" fill="#0f172a">PBKDF2, 600 000 giri  →  chiave AES-256</text>
<text x="40" y="294" font-size="12" fill="#475569">calcolata al momento, usata, buttata:</text>
<text x="40" y="312" font-size="12" fill="#475569">non è salvata da nessuna parte</text>
<text x="40" y="334" font-size="12" font-weight="700" fill="#b91c1c">password persa = backup che non si aprono</text>

<line x1="350" y1="225" x2="405" y2="225" stroke="#b91c1c" stroke-width="3" marker-end="url(#ak)"/>
<text x="378" y="212" text-anchor="middle" font-size="12" fill="#b91c1c">chiude</text>

<!-- outer box: backup file -->
<rect x="410" y="95" width="770" height="440" rx="16" fill="#fff5f5" stroke="#b91c1c" stroke-width="3"/>
<text x="795" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">Il file di backup (cifrato con la chiave della password)</text>

<!-- database.dump -->
<rect x="440" y="150" width="440" height="250" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
<text x="660" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">database.dump</text>
<text x="460" y="206" font-size="13" fill="#334155">conti, movimenti, categorie, regole, budget…</text>
<text x="460" y="226" font-size="12" fill="#475569">(nel database sono in chiaro: li protegge il server,</text>
<text x="460" y="244" font-size="12" fill="#475569">e nel backup la password)</text>
<rect x="460" y="262" width="400" height="118" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="660" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">i segreti, ANCORA cifrati</text>
<text x="480" y="312" font-size="12" fill="#334155">la chiave privata di Enable Banking</text>
<text x="480" y="332" font-size="12" fill="#334155">la chiave di Gemini</text>
<text x="480" y="356" font-size="12" font-family="Consolas, monospace" fill="#0f172a">v1:Kx3f…  (AES-256-GCM)</text>

<!-- encryption.key -->
<rect x="910" y="150" width="250" height="150" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
<text x="1035" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">encryption.key</text>
<text x="930" y="204" font-size="12" fill="#334155">32 byte casuali (AES-256)</text>
<text x="930" y="222" font-size="12" fill="#334155">generati dal backend al</text>
<text x="930" y="240" font-size="12" fill="#334155">primo avvio; sul server in</text>
<text x="930" y="258" font-size="12" font-family="Consolas, monospace" fill="#0f172a">.data/encryption.key</text>
<text x="930" y="284" font-size="12" font-weight="700" fill="#c2410c">apre SOLO i segreti</text>

<line x1="910" y1="250" x2="865" y2="310" stroke="#c2410c" stroke-width="3" marker-end="url(#ak)"/>
<text x="900" y="322" font-size="12" fill="#c2410c">apre</text>

<rect x="910" y="320" width="250" height="80" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="930" y="350" font-size="13" font-family="Consolas, monospace" fill="#0f172a">manifest.txt</text>
<text x="930" y="376" font-size="13" font-family="Consolas, monospace" fill="#0f172a">SHA256SUMS</text>

<text x="795" y="440" text-anchor="middle" font-size="13" fill="#334155">Perché la chiave dei segreti viaggia DENTRO il backup: senza, un backup ripristinato su un server nuovo</text>
<text x="795" y="460" text-anchor="middle" font-size="13" fill="#334155">avrebbe i segreti illeggibili. È al sicuro perché tutto il file è chiuso dalla password.</text>
<text x="795" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Chi trova il file senza la password: niente. Chi ha la password: tutto, compresi i segreti.</text>

<!-- bottom: server -->
<rect x="20" y="570" width="1160" height="130" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="600" y="600" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">E sul server, senza backup?</text>
<text x="600" y="628" text-anchor="middle" font-size="13" fill="#334155">Il database e .data/encryption.key stanno separati: chi ruba solo il database (o una sua copia) non legge i segreti.</text>
<text x="600" y="652" text-anchor="middle" font-size="13" fill="#334155">La password dei backup sta nel .env: serve solo per fare e aprire i backup, mai al backend.</text>
<text x="600" y="676" text-anchor="middle" font-size="13" fill="#334155">Due chiavi diverse: perdere una non apre l'altra.</text>
</svg>
