<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
</defs>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Come il codice riconosce la categoria delle ritenute</text>
<text x="600" y="68" text-anchor="middle" font-size="15" fill="#475569">il nome è dell'utente e può cambiare; il ruolo è del codice e non cambia mai</text>

<!-- PRIMA -->
<rect x="20" y="95" width="565" height="525" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="302" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">Prima (fino alla 1.2.5): dal NOME</text>

<rect x="50" y="150" width="505" height="56" rx="10" fill="#ffffff" stroke="#94a3b8"/>
<text x="70" y="175" font-size="14" font-family="Consolas, monospace" fill="#0f172a">static final String WITHHOLDING = "Ritenute";</text>
<text x="70" y="195" font-size="13" fill="#475569">il codice cerca una categoria con questo nome esatto</text>

<text x="50" y="240" font-size="15" font-weight="700" fill="#0f172a">tabella category</text>
<rect x="50" y="250" width="505" height="40" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="70" y="276" font-size="15" fill="#0f172a">id 26 · name "Ritenute"</text>
<text x="400" y="276" font-size="15" font-weight="700" fill="#15803d">trovata ✓</text>

<path d="M302,300 L302,335" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="315" y="324" font-size="13" fill="#b91c1c">l'utente la rinomina</text>

<rect x="50" y="345" width="505" height="40" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
<text x="70" y="371" font-size="15" fill="#0f172a">id 26 · name "Ritenute fiscali"</text>
<text x="400" y="371" font-size="15" font-weight="700" fill="#b91c1c">non trovata ✗</text>

<rect x="50" y="405" width="505" height="195" rx="10" fill="#ffffff" stroke="#fca5a5"/>
<text x="70" y="433" font-size="15" font-weight="700" fill="#b91c1c">Investimenti sbaglia, in silenzio</text>
<text x="70" y="460" font-size="14" fill="#0f172a">cedola lorda</text><text x="525" y="460" text-anchor="end" font-size="14" fill="#0f172a">125,00 €</text>
<text x="70" y="484" font-size="14" fill="#0f172a">ritenuta (non riconosciuta)</text><text x="525" y="484" text-anchor="end" font-size="14" fill="#0f172a">—</text>
<text x="70" y="508" font-size="14" font-weight="700" fill="#b91c1c">"netto"</text><text x="525" y="508" text-anchor="end" font-size="14" font-weight="700" fill="#b91c1c">125,00 €</text>
<text x="70" y="540" font-size="13" fill="#475569">la ritenuta da -15,63 € finisce tra le "Altre tasse":</text>
<text x="70" y="560" font-size="13" fill="#475569">il netto è troppo alto, e nessun messaggio lo dice.</text>
<text x="70" y="584" font-size="13" fill="#475569">Lo stesso con un'app in inglese ("Withholding tax").</text>

<!-- ADESSO -->
<rect x="615" y="95" width="565" height="525" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="897" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">Adesso (V37): dal RUOLO</text>

<rect x="645" y="150" width="505" height="56" rx="10" fill="#ffffff" stroke="#94a3b8"/>
<text x="665" y="175" font-size="14" font-family="Consolas, monospace" fill="#0f172a">category.getRole() == CategoryRole.WITHHOLDING</text>
<text x="665" y="195" font-size="13" fill="#475569">il codice guarda una colonna che l'utente non tocca</text>

<text x="645" y="240" font-size="15" font-weight="700" fill="#0f172a">tabella category</text>
<rect x="645" y="250" width="505" height="40" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="665" y="276" font-size="15" fill="#0f172a">id 26 · "Ritenute" · role WITHHOLDING</text>
<text x="1060" y="276" font-size="15" font-weight="700" fill="#15803d">✓</text>

<path d="M897,300 L897,335" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="910" y="324" font-size="13" fill="#1d4ed8">l'utente la rinomina</text>

<rect x="645" y="345" width="505" height="40" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
<text x="665" y="371" font-size="15" fill="#0f172a">id 26 · "Ritenute fiscali" · role WITHHOLDING</text>
<text x="1060" y="371" font-size="15" font-weight="700" fill="#15803d">✓</text>

<rect x="645" y="405" width="505" height="195" rx="10" fill="#ffffff" stroke="#93c5fd"/>
<text x="665" y="433" font-size="15" font-weight="700" fill="#15803d">Investimenti resta giusto</text>
<text x="665" y="460" font-size="14" fill="#0f172a">cedola lorda</text><text x="1120" y="460" text-anchor="end" font-size="14" fill="#0f172a">125,00 €</text>
<text x="665" y="484" font-size="14" fill="#0f172a">ritenuta</text><text x="1120" y="484" text-anchor="end" font-size="14" fill="#0f172a">-15,63 €</text>
<text x="665" y="508" font-size="14" font-weight="700" fill="#15803d">netto</text><text x="1120" y="508" text-anchor="end" font-size="14" font-weight="700" fill="#15803d">109,37 €</text>
<text x="665" y="540" font-size="13" fill="#475569">il nome si cambia quando si vuole, in qualunque lingua;</text>
<text x="665" y="560" font-size="13" fill="#475569">la categoria non si elimina (al suo posto non ce ne</text>
<text x="665" y="584" font-size="13" fill="#475569">sarebbe un'altra: il ruolo non passa con il nome).</text>
</svg>
