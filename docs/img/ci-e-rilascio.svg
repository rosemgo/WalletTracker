<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">GitHub Actions: ci.yml controlla, rilascio.yml pubblica</text>
<text x="600" y="64" text-anchor="middle" font-size="14" fill="#475569">ogni job gira su una macchina nuova e vuota (il runner), che alla fine viene distrutta</text>

<!-- eventi -->
<rect x="20" y="95" width="250" height="90" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="145" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">push su un ramo</text>
<text x="145" y="148" text-anchor="middle" font-size="12" fill="#334155">o una pull request</text>
<text x="145" y="168" text-anchor="middle" font-size="12" fill="#334155">(il lavoro di tutti i giorni)</text>

<rect x="20" y="430" width="250" height="90" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="145" y="460" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">tag v1.0.0</text>
<text x="145" y="483" text-anchor="middle" font-size="12" fill="#334155">git push origin v1.0.0</text>
<text x="145" y="503" text-anchor="middle" font-size="12" fill="#334155">(pubblicare una versione)</text>

<!-- ci.yml -->
<rect x="330" y="85" width="500" height="200" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
<text x="580" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">.github/workflows/ci.yml   (3 job in parallelo)</text>
<rect x="350" y="130" width="145" height="70" rx="9" fill="#ffffff" stroke="#15803d"/>
<text x="422" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Backend</text>
<text x="422" y="178" text-anchor="middle" font-size="11" fill="#334155">Maven, test Java</text>
<rect x="507" y="130" width="145" height="70" rx="9" fill="#ffffff" stroke="#15803d"/>
<text x="579" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Frontend</text>
<text x="579" y="178" text-anchor="middle" font-size="11" fill="#334155">Prettier, test, build</text>
<rect x="664" y="130" width="150" height="70" rx="9" fill="#ffffff" stroke="#15803d"/>
<text x="739" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Installazione</text>
<text x="739" y="178" text-anchor="middle" font-size="11" fill="#334155">installa.sh da zero</text>
<text x="580" y="232" text-anchor="middle" font-size="13" fill="#334155">risultato: ✓ verde o ✗ rossa accanto al commit</text>
<text x="580" y="256" text-anchor="middle" font-size="12" fill="#475569">non produce niente per gli utenti</text>

<line x1="270" y1="140" x2="325" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#ak)"/>

<!-- main protetto -->
<rect x="880" y="85" width="300" height="200" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
<text x="1030" y="113" text-anchor="middle" font-size="16" font-weight="700" fill="#c2410c">main (protetto)</text>
<text x="898" y="142" font-size="12" fill="#334155">il ruleset "Proteggi main":</text>
<text x="898" y="166" font-size="12" fill="#334155">• solo con una pull request</text>
<text x="898" y="188" font-size="12" fill="#334155">• solo con i 3 job verdi</text>
<text x="898" y="210" font-size="12" fill="#334155">• niente force push, niente</text>
<text x="910" y="228" font-size="12" fill="#334155">cancellazione</text>
<text x="898" y="256" font-size="12" fill="#475569">la unisci tu, con il tuo account</text>
<line x1="830" y1="185" x2="875" y2="185" stroke="#334155" stroke-width="2.5" marker-end="url(#ak)"/>

<!-- rilascio.yml -->
<rect x="330" y="330" width="850" height="290" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="2.5"/>
<text x="755" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#7e22ce">.github/workflows/rilascio.yml   (3 job uno dopo l'altro)</text>

<rect x="350" y="380" width="250" height="150" rx="10" fill="#ffffff" stroke="#7e22ce"/>
<text x="475" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">① ci</text>
<text x="365" y="430" font-size="12" fill="#334155">uses: ./.github/workflows/ci.yml</text>
<text x="365" y="452" font-size="12" fill="#334155">= gli stessi 3 job di sopra</text>
<text x="365" y="474" font-size="12" fill="#334155">(ci.yml ha "workflow_call")</text>
<text x="365" y="500" font-size="12" fill="#b91c1c">un test rosso = stop,</text>
<text x="365" y="518" font-size="12" fill="#b91c1c">non si pubblica niente</text>

<rect x="630" y="380" width="260" height="150" rx="10" fill="#ffffff" stroke="#7e22ce"/>
<text x="760" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">② immagini (needs: ci)</text>
<text x="645" y="430" font-size="12" fill="#334155">matrix: backend, web, backup</text>
<text x="645" y="452" font-size="12" fill="#334155">per amd64 e arm64</text>
<text x="645" y="474" font-size="12" fill="#334155">packages: write</text>
<text x="645" y="500" font-size="12" fill="#334155">→ ghcr.io/rosemgo/</text>
<text x="645" y="518" font-size="12" fill="#334155">   wallettracker-…:1.0.0</text>

<rect x="920" y="380" width="245" height="150" rx="10" fill="#ffffff" stroke="#7e22ce"/>
<text x="1042" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">③ release (needs: immagini)</text>
<text x="935" y="430" font-size="12" fill="#334155">prepara-zip.sh</text>
<text x="935" y="452" font-size="12" fill="#334155">gh release create</text>
<text x="935" y="474" font-size="12" fill="#334155">contents: write</text>
<text x="935" y="500" font-size="12" fill="#334155">→ ZIP + SHA256SUMS</text>
<text x="935" y="518" font-size="12" fill="#334155">   + novità</text>

<line x1="600" y1="455" x2="625" y2="455" stroke="#334155" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="890" y1="455" x2="915" y2="455" stroke="#334155" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="270" y1="475" x2="345" y2="455" stroke="#334155" stroke-width="2.5" marker-end="url(#ak)"/>

<text x="755" y="562" text-anchor="middle" font-size="13" fill="#334155">Push normale che cambia un Dockerfile: ① saltato, ② costruisce SENZA pubblicare (versione "prova"), ③ non parte.</text>
<text x="755" y="586" text-anchor="middle" font-size="13" fill="#334155">Push che cambia solo Java o Angular: rilascio.yml non parte; basta ci.yml.</text>
<text x="755" y="608" text-anchor="middle" font-size="12" fill="#475569">($BUILDPLATFORM: si compila una volta sola; QEMU solo per l'immagine finale arm64)</text>

<rect x="20" y="650" width="1160" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
<text x="40" y="680" font-size="14" font-weight="700" fill="#0f172a">Dove si vede:</text>
<text x="40" y="704" font-size="13" fill="#334155">scheda Actions del repository (ogni esecuzione → i job → ogni step con il suo output); ✓ / ✗ accanto ai commit e alle pull request;</text>
<text x="40" y="726" font-size="13" fill="#334155">un'email se qualcosa fallisce. I permessi: di serie solo "contents: read"; i job che pubblicano chiedono di più, solo per sé.</text>
</svg>
