<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1930" viewBox="0 0 1180 1930" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="astate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="acode" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ajwt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e22ce"/></marker><marker id="aplain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1180" height="1930" fill="#ffffff"/>
<text x="590.0" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Come si collega una banca a WalletTracker</text>
<text x="590.0" y="64" text-anchor="middle" font-size="14" fill="#475569">chi parla con chi, in che ordine, e dove stanno state, code e JWT</text>
<line x1="110" y1="120" x2="110" y2="1800" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="15" y="82" width="190" height="48" rx="10" fill="#0f172a"/>
<text x="110" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Tu (browser)</text>
<text x="110" y="121" text-anchor="middle" font-size="11.5" fill="#cbd5e1">Chrome sul tuo PC</text>
<line x1="350" y1="120" x2="350" y2="1800" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="255" y="82" width="190" height="48" rx="10" fill="#0f172a"/>
<text x="350" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Dashboard</text>
<text x="350" y="121" text-anchor="middle" font-size="11.5" fill="#cbd5e1">Angular · localhost:8443</text>
<line x1="590" y1="120" x2="590" y2="1800" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="495" y="82" width="190" height="48" rx="10" fill="#0f172a"/>
<text x="590" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Backend</text>
<text x="590" y="121" text-anchor="middle" font-size="11.5" fill="#cbd5e1">Spring Boot · localhost:8080</text>
<line x1="830" y1="120" x2="830" y2="1800" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="735" y="82" width="190" height="48" rx="10" fill="#0f172a"/>
<text x="830" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Enable Banking</text>
<text x="830" y="121" text-anchor="middle" font-size="11.5" fill="#cbd5e1">api.enablebanking.com</text>
<line x1="1070" y1="120" x2="1070" y2="1800" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="975" y="82" width="190" height="48" rx="10" fill="#0f172a"/>
<text x="1070" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">La tua banca</text>
<text x="1070" y="121" text-anchor="middle" font-size="11.5" fill="#cbd5e1">es. ING</text>
<rect x="20" y="144" width="1140" height="26" rx="6" fill="#f8fafc"/>
<text x="34" y="162" font-size="13.5" font-weight="700" fill="#0f172a">A · Avvio: il backend ottiene il link di login</text>
<line x1="110" y1="204" x2="342" y2="204" stroke="#334155" stroke-width="2.4" marker-end="url(#aplain)"/>
<text x="230.0" y="196" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">clic «Collega» su ING</text>
<circle cx="88" cy="204" r="12" fill="#334155"/><text x="88" y="208.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<line x1="350" y1="262" x2="582" y2="262" stroke="#334155" stroke-width="2.4" marker-end="url(#aplain)"/>
<text x="470.0" y="254" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">POST /api/connections</text>
<text x="470.0" y="280" text-anchor="middle" font-size="12" fill="#475569" stroke="#fff" stroke-width="5" paint-order="stroke">{ bank: &quot;ING&quot;, country: &quot;IT&quot; }</text>
<circle cx="328" cy="262" r="12" fill="#334155"/><text x="328" y="266.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
<rect x="445.0" y="298" width="290" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="590" y="316" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="700">STATE: genera S = 3f2a9c1e-…</text>
<text x="590" y="334" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="400">casuale, lo ricorda per 30 minuti</text>
<line x1="590" y1="390" x2="822" y2="390" stroke="#7e22ce" stroke-width="2.4" marker-end="url(#ajwt)"/>
<text x="710.0" y="382" text-anchor="middle" font-size="13.5" fill="#7e22ce" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">POST /auth  { state: S, redirect_url, banca }</text>
<text x="710.0" y="408" text-anchor="middle" font-size="12" fill="#475569" stroke="#fff" stroke-width="5" paint-order="stroke">Authorization: Bearer JWT  ← firmato con la tua chiave privata (.pem)</text>
<circle cx="568" cy="390" r="12" fill="#7e22ce"/><text x="568" y="394.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
<rect x="665.0" y="434" width="330" height="68" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="830" y="452" text-anchor="middle" font-size="13" fill="#7e22ce" font-weight="700">Verifica la firma del JWT</text>
<text x="830" y="470" text-anchor="middle" font-size="13" fill="#7e22ce" font-weight="400">con la tua chiave pubblica: «è proprio la tua app»</text>
<text x="830" y="488" text-anchor="middle" font-size="13" fill="#7e22ce" font-weight="400">crea un login legato alla TUA app</text>
<line x1="830" y1="544" x2="598" y2="544" stroke="#334155" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#aplain)"/>
<text x="710.0" y="536" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">url del login sulla banca</text>
<circle cx="568" cy="544" r="12" fill="#334155"/><text x="568" y="548.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
<line x1="590" y1="602" x2="358" y2="602" stroke="#334155" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#aplain)"/>
<text x="470.0" y="594" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">{ url }</text>
<circle cx="328" cy="602" r="12" fill="#334155"/><text x="328" y="606.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
<line x1="350" y1="660" x2="118" y2="660" stroke="#334155" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#aplain)"/>
<text x="230.0" y="652" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">il browser va all’url della banca</text>
<circle cx="88" cy="660" r="12" fill="#334155"/><text x="88" y="664.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
<rect x="20" y="698" width="1140" height="26" rx="6" fill="#f8fafc"/>
<text x="34" y="716" font-size="13.5" font-weight="700" fill="#0f172a">B · Login sul sito della banca (WalletTracker non vede mai le tue credenziali)</text>
<line x1="110" y1="758" x2="1062" y2="758" stroke="#334155" stroke-width="2.4" marker-end="url(#aplain)"/>
<text x="590.0" y="750" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">login + SCA (password, codice/app)</text>
<circle cx="88" cy="758" r="12" fill="#334155"/><text x="88" y="762.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text>
<line x1="1070" y1="816" x2="838" y2="816" stroke="#334155" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#aplain)"/>
<text x="950.0" y="808" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">consenso dato: lettura dei conti per 90/180 giorni</text>
<circle cx="808" cy="816" r="12" fill="#334155"/><text x="808" y="820.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text>
<rect x="680.0" y="852" width="300" height="68" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="830" y="870" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="700">CODE: genera C = a1b2c3…</text>
<text x="830" y="888" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="400">buono monouso, valido pochi minuti</text>
<text x="830" y="906" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="400">e solo per la TUA app</text>
<line x1="830" y1="962" x2="118" y2="962" stroke="#c2410c" stroke-width="2.4" marker-end="url(#acode)"/>
<text x="470.0" y="954" text-anchor="middle" font-size="13.5" fill="#c2410c" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">redirect → https://localhost:8443/callback?code=C&amp;state=S</text>
<circle cx="88" cy="962" r="12" fill="#c2410c"/><text x="88" y="966.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">9</text>
<rect x="20" y="1000" width="1140" height="26" rx="6" fill="#f8fafc"/>
<text x="34" y="1018" font-size="13.5" font-weight="700" fill="#0f172a">C · Ritorno: il backend scambia il code con la sessione</text>
<line x1="110" y1="1060" x2="342" y2="1060" stroke="#c2410c" stroke-width="2.4" marker-end="url(#acode)"/>
<text x="230.0" y="1052" text-anchor="middle" font-size="13.5" fill="#c2410c" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">apre /callback?code=C&amp;state=S</text>
<circle cx="88" cy="1060" r="12" fill="#c2410c"/><text x="88" y="1064.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">10</text>
<line x1="350" y1="1118" x2="582" y2="1118" stroke="#c2410c" stroke-width="2.4" marker-end="url(#acode)"/>
<text x="470.0" y="1110" text-anchor="middle" font-size="13.5" fill="#c2410c" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">POST /api/connections/complete</text>
<text x="470.0" y="1136" text-anchor="middle" font-size="12" fill="#475569" stroke="#fff" stroke-width="5" paint-order="stroke">{ code: C, state: S }</text>
<circle cx="328" cy="1118" r="12" fill="#c2410c"/><text x="328" y="1122.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">11</text>
<rect x="390.0" y="1154" width="400" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="590" y="1172" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="700">CONTROLLO STATE: S è nostro? mai usato? &lt; 30 min?</text>
<text x="590" y="1190" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="400">sì → lo cancella (vale una volta) · no → 400, stop</text>
<line x1="590" y1="1246" x2="822" y2="1246" stroke="#7e22ce" stroke-width="2.4" marker-end="url(#ajwt)"/>
<text x="710.0" y="1238" text-anchor="middle" font-size="13.5" fill="#7e22ce" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">POST /sessions  { code: C }</text>
<text x="710.0" y="1264" text-anchor="middle" font-size="12" fill="#475569" stroke="#fff" stroke-width="5" paint-order="stroke">Authorization: Bearer JWT  ← firmato con la tua chiave privata</text>
<circle cx="568" cy="1246" r="12" fill="#7e22ce"/><text x="568" y="1250.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">12</text>
<rect x="640.0" y="1290" width="380" height="50" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="830" y="1308" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="700">CONTROLLO CODE: firma valida? C nato da questa app?</text>
<text x="830" y="1326" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="400">C non già usato? → crea la sessione</text>
<line x1="830" y1="1382" x2="598" y2="1382" stroke="#15803d" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#aok)"/>
<text x="710.0" y="1374" text-anchor="middle" font-size="13.5" fill="#15803d" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">session_id + elenco dei conti (uid)</text>
<circle cx="568" cy="1382" r="12" fill="#15803d"/><text x="568" y="1386.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">13</text>
<rect x="440.0" y="1418" width="300" height="32" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="590" y="1436" text-anchor="middle" font-size="13" fill="#15803d" font-weight="700">salva collegamento e conti nel database</text>
<rect x="20" y="1472" width="1140" height="26" rx="6" fill="#f8fafc"/>
<text x="34" y="1490" font-size="13.5" font-weight="700" fill="#0f172a">D · Da qui in poi: lettura dei movimenti (anche ogni 6 ore, in automatico)</text>
<line x1="590" y1="1532" x2="822" y2="1532" stroke="#7e22ce" stroke-width="2.4" marker-end="url(#ajwt)"/>
<text x="710.0" y="1524" text-anchor="middle" font-size="13.5" fill="#7e22ce" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">GET /accounts/{uid}/transactions</text>
<text x="710.0" y="1550" text-anchor="middle" font-size="12" fill="#475569" stroke="#fff" stroke-width="5" paint-order="stroke">Authorization: Bearer JWT (+ header PSU se sei presente)</text>
<circle cx="568" cy="1532" r="12" fill="#7e22ce"/><text x="568" y="1536.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">14</text>
<line x1="830" y1="1598" x2="1062" y2="1598" stroke="#334155" stroke-width="2.4" marker-end="url(#aplain)"/>
<text x="950.0" y="1590" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">legge i movimenti (consenso valido)</text>
<circle cx="808" cy="1598" r="12" fill="#334155"/><text x="808" y="1602.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">15</text>
<line x1="830" y1="1656" x2="598" y2="1656" stroke="#15803d" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#aok)"/>
<text x="710.0" y="1648" text-anchor="middle" font-size="13.5" fill="#15803d" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">movimenti (JSON)</text>
<circle cx="568" cy="1656" r="12" fill="#15803d"/><text x="568" y="1660.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">16</text>
<line x1="590" y1="1714" x2="358" y2="1714" stroke="#15803d" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#aok)"/>
<text x="470.0" y="1706" text-anchor="middle" font-size="13.5" fill="#15803d" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">«ING collegata: 3 conti, 154 movimenti»</text>
<circle cx="328" cy="1714" r="12" fill="#15803d"/><text x="328" y="1718.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">17</text>
<rect x="20" y="1830" width="1140" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="44.0" y="1846" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="70.0" y="1859" font-size="13" fill="#0f172a">state: «questo ritorno l’ho chiesto io, adesso» — protegge il ritorno (passi 2→11)</text>
<rect x="594.0" y="1846" width="16" height="16" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="620.0" y="1859" font-size="13" fill="#0f172a">code: buono monouso, inutile senza una richiesta firmata dalla tua app</text>
<rect x="44.0" y="1874" width="16" height="16" rx="3" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="70.0" y="1887" font-size="13" fill="#0f172a">JWT: firma con la chiave privata (.pem) — prova che sei TU a chiamare Enable Banking</text>
<rect x="594.0" y="1874" width="16" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="620.0" y="1887" font-size="13" fill="#0f172a">risultato: sessione, conti e movimenti</text>
</svg>