<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1036" viewBox="0 0 1180 1036" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="astate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="acode" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ajwt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e22ce"/></marker><marker id="aplain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1180" height="1036" fill="#ffffff"/>
<text x="590.0" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Perché serve lo state (il caso di un servizio con molti utenti)</text>
<text x="590.0" y="64" text-anchor="middle" font-size="14" fill="#475569">l’attacco CSRF «classico» sul ritorno dal login</text>
<line x1="110" y1="120" x2="110" y2="906" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="15" y="82" width="190" height="48" rx="10" fill="#0f172a"/>
<text x="110" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Attaccante</text>
<text x="110" y="121" text-anchor="middle" font-size="11.5" fill="#cbd5e1">il suo browser</text>
<line x1="430" y1="120" x2="430" y2="906" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="335" y="82" width="190" height="48" rx="10" fill="#0f172a"/>
<text x="430" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">App multiutente</text>
<text x="430" y="121" text-anchor="middle" font-size="11.5" fill="#cbd5e1">una sola app per tutti</text>
<line x1="750" y1="120" x2="750" y2="906" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="655" y="82" width="190" height="48" rx="10" fill="#0f172a"/>
<text x="750" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Tu (vittima)</text>
<text x="750" y="121" text-anchor="middle" font-size="11.5" fill="#cbd5e1">il tuo browser, già loggato</text>
<line x1="1070" y1="120" x2="1070" y2="906" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="975" y="82" width="190" height="48" rx="10" fill="#0f172a"/>
<text x="1070" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Enable Banking</text>
<text x="1070" y="121" text-anchor="middle" font-size="11.5" fill="#cbd5e1"></text>
<rect x="20" y="144" width="1140" height="26" rx="6" fill="#f8fafc"/>
<text x="34" y="162" font-size="13.5" font-weight="700" fill="#0f172a">Ipotesi: WalletTracker diventa un servizio online con molti utenti e UNA sola applicazione Enable Banking</text>
<line x1="110" y1="204" x2="422" y2="204" stroke="#334155" stroke-width="2.4" marker-end="url(#aplain)"/>
<text x="270.0" y="196" text-anchor="middle" font-size="13.5" fill="#334155" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">si iscrive anche lui e preme «Collega»</text>
<circle cx="88" cy="204" r="12" fill="#334155"/><text x="88" y="208.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<line x1="430" y1="262" x2="1062" y2="262" stroke="#7e22ce" stroke-width="2.4" marker-end="url(#ajwt)"/>
<text x="750.0" y="254" text-anchor="middle" font-size="13.5" fill="#7e22ce" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">POST /auth (JWT dell’app, uguale per tutti)</text>
<circle cx="408" cy="262" r="12" fill="#7e22ce"/><text x="408" y="266.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
<rect x="30.0" y="298" width="330" height="68" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="195.0" y="316" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="700">l’attaccante fa login sulla SUA banca, ma</text>
<text x="195.0" y="334" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="400">si ferma prima del ritorno e copia l’indirizzo:</text>
<text x="195.0" y="352" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="400">…/callback?code=C_attaccante&amp;state=…</text>
<line x1="110" y1="408" x2="742" y2="408" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#abad)"/>
<text x="430.0" y="400" text-anchor="middle" font-size="13.5" fill="#b91c1c" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">ti fa aprire quel link (email, pagina, immagine nascosta)</text>
<circle cx="88" cy="408" r="12" fill="#b91c1c"/><text x="88" y="412.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
<line x1="750" y1="466" x2="438" y2="466" stroke="#c2410c" stroke-width="2.4" marker-end="url(#acode)"/>
<text x="590.0" y="458" text-anchor="middle" font-size="13.5" fill="#c2410c" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">il TUO browser chiama /callback?code=C_attaccante</text>
<circle cx="408" cy="466" r="12" fill="#c2410c"/><text x="408" y="470.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
<rect x="20" y="504" width="1140" height="26" rx="6" fill="#f8fafc"/>
<text x="34" y="522" font-size="13.5" font-weight="700" fill="#0f172a">SENZA state</text>
<line x1="430" y1="564" x2="1062" y2="564" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#abad)"/>
<text x="750.0" y="556" text-anchor="middle" font-size="13.5" fill="#b91c1c" font-weight="600" stroke="#fff" stroke-width="5" paint-order="stroke">POST /sessions {C_attaccante} + JWT dell’app → valido!</text>
<circle cx="408" cy="564" r="12" fill="#b91c1c"/><text x="408" y="568.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
<rect x="215.0" y="600" width="430" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="430" y="618" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="700">il conto dell’ATTACCANTE finisce nel TUO profilo</text>
<text x="430" y="636" text-anchor="middle" font-size="13" fill="#b91c1c" font-weight="400">(il code è nato dalla stessa app: Enable Banking lo accetta)</text>
<rect x="20" y="672" width="1140" height="26" rx="6" fill="#f8fafc"/>
<text x="34" y="690" font-size="13.5" font-weight="700" fill="#0f172a">CON state</text>
<rect x="215.0" y="710" width="430" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="430" y="728" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="700">il tuo browser non ha mai avviato questo collegamento:</text>
<text x="430" y="746" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="400">lo state non è tra quelli generati per TE → rifiutato</text>
<rect x="150.0" y="780" width="560" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="430" y="798" text-anchor="middle" font-size="13" fill="#15803d" font-weight="700">nella nostra installazione personale il code di un’altra app</text>
<text x="430" y="816" text-anchor="middle" font-size="13" fill="#15803d" font-weight="400">verrebbe già rifiutato da Enable Banking (passo 12): lo state è una difesa in più</text>
<rect x="20" y="936" width="1140" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="44.0" y="952" width="16" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="70.0" y="965" font-size="13" fill="#0f172a">attacco riuscito</text>
<rect x="594.0" y="952" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="620.0" y="965" font-size="13" fill="#0f172a">protezione dello state</text>
<rect x="44.0" y="980" width="16" height="16" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="70.0" y="993" font-size="13" fill="#0f172a">il code rubato</text>
<rect x="594.0" y="980" width="16" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="620.0" y="993" font-size="13" fill="#0f172a">nel nostro caso (una app per installazione)</text>
</svg>