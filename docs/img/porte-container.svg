<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e22ce"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Le porte: del PC, di nginx, di Tomcat</text>
<text x="600" y="68" text-anchor="middle" font-size="15" fill="#475569">ogni container è come un piccolo computer, con le sue porte: due "8080" in due container diversi non si disturbano</text>

<!-- PC -->
<rect x="20" y="90" width="1160" height="690" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="45" y="120" font-size="18" font-weight="700" fill="#334155">Il tuo PC</text>

<rect x="45" y="150" width="210" height="80" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="150" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Browser del PC</text>
<text x="150" y="206" text-anchor="middle" font-size="13" fill="#334155">http://localhost:8000</text>

<rect x="45" y="390" width="210" height="90" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="150" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#7e22ce">Tailscale (passo 4)</text>
<text x="150" y="444" text-anchor="middle" font-size="13" fill="#334155">porta il telefono</text>
<text x="150" y="464" text-anchor="middle" font-size="13" fill="#334155">solo a 127.0.0.1:8001</text>

<!-- PC ports -->
<rect x="300" y="160" width="130" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="365" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">PC :8000</text>
<text x="365" y="206" text-anchor="middle" font-size="12" fill="#475569">127.0.0.1</text>
<rect x="300" y="405" width="130" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="365" y="431" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">PC :8001</text>
<text x="365" y="451" text-anchor="middle" font-size="12" fill="#475569">127.0.0.1</text>
<text x="365" y="250" text-anchor="middle" font-size="12" fill="#475569">"ports:" del Compose</text>
<text x="365" y="268" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#475569">8000:8080</text>
<text x="365" y="490" text-anchor="middle" font-size="12" fill="#475569">"ports:" del Compose</text>
<text x="365" y="508" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#475569">8001:8081</text>

<line x1="255" y1="190" x2="295" y2="190" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<line x1="255" y1="435" x2="295" y2="435" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#ap)"/>

<!-- Docker network -->
<rect x="460" y="105" width="700" height="655" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="480" y="133" font-size="15" font-weight="700" fill="#334155">Rete di Docker (172.18.x.x): dal PC si entra solo dove c'è "ports:"</text>

<!-- web -->
<rect x="490" y="150" width="300" height="350" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
<text x="640" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">container web: nginx</text>

<rect x="510" y="198" width="260" height="105" rx="10" fill="#ffffff" stroke="#15803d"/>
<text x="640" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">server { listen 8080; }</text>
<text x="640" y="246" text-anchor="middle" font-size="13" fill="#334155">$wallettracker_access = local</text>
<text x="640" y="270" text-anchor="middle" font-size="12" fill="#475569">+ include wallettracker.conf</text>
<text x="640" y="290" text-anchor="middle" font-size="12" fill="#475569">(il sito, uguale per le due porte)</text>

<rect x="510" y="375" width="260" height="105" rx="10" fill="#ffffff" stroke="#15803d"/>
<text x="640" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">server { listen 8081; }</text>
<text x="640" y="423" text-anchor="middle" font-size="13" fill="#334155">$wallettracker_access = remote</text>
<text x="640" y="447" text-anchor="middle" font-size="12" fill="#475569">+ include wallettracker.conf</text>
<text x="640" y="467" text-anchor="middle" font-size="12" fill="#475569">(lo stesso sito)</text>

<line x1="430" y1="190" x2="505" y2="240" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
<line x1="430" y1="435" x2="505" y2="425" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#ap)"/>

<!-- backend -->
<rect x="860" y="150" width="280" height="200" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
<text x="1000" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">container backend</text>
<rect x="880" y="198" width="240" height="70" rx="10" fill="#ffffff" stroke="#c2410c"/>
<text x="1000" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Tomcat ascolta su 8080</text>
<text x="1000" y="246" text-anchor="middle" font-size="12" fill="#475569">la SUA 8080, non quella di nginx</text>
<text x="1000" y="296" text-anchor="middle" font-size="13" fill="#b91c1c">nessun "ports:":</text>
<text x="1000" y="316" text-anchor="middle" font-size="13" fill="#b91c1c">dal PC non si raggiunge</text>

<line x1="770" y1="250" x2="875" y2="233" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="770" y1="427" x2="900" y2="350" stroke="#15803d" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="640" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">/api/… → http://backend:8080</text>
<text x="640" y="552" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#15803d">+ X-WalletTracker-Access: local | remote</text>

<!-- db -->
<rect x="860" y="450" width="280" height="110" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
<text x="1000" y="482" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">container db</text>
<text x="1000" y="508" text-anchor="middle" font-size="13" fill="#334155">PostgreSQL ascolta su 5432</text>
<text x="1000" y="530" text-anchor="middle" font-size="13" fill="#b91c1c">nessun "ports:"</text>
<line x1="1000" y1="350" x2="1000" y2="445" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ao)"/>

<!-- legend -->
<rect x="490" y="590" width="650" height="150" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="510" y="620" font-size="14" font-weight="700" fill="#0f172a">Come si legge</text>
<text x="510" y="646" font-size="13" fill="#334155">• "listen 8080" (default.conf) = la porta su cui ascolta nginx, dentro il container web</text>
<text x="510" y="670" font-size="13" fill="#334155">• "http://backend:8080" (wallettracker.conf) = la porta di Tomcat, che nginx chiama</text>
<text x="510" y="694" font-size="13" fill="#334155">• Due porte di nginx = due ingressi: il backend sa da quale sei entrato (local / remote)</text>
<text x="510" y="718" font-size="13" fill="#334155">• Il browser può scrivere ciò che vuole nelle intestazioni, ma non può cambiare ingresso</text>
</svg>
