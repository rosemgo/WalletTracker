<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Un file in un conto collegato: solo i mesi che la banca non ha dato</text>
<text x="600" y="68" text-anchor="middle" font-size="15" fill="#475569">esempio: il conto …0002, collegato a luglio; la banca ha dato i movimenti dal 22 luglio 2026</text>

<!-- asse del tempo -->
<path d="M60,330 L1150,330" stroke="#475569" stroke-width="2" marker-end="url(#ab)"/>
<text x="60" y="356" font-size="13" fill="#475569">25 marzo</text>
<text x="1100" y="356" font-size="13" fill="#475569">5 novembre</text>
<line x1="720" y1="110" x2="720" y2="420" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="720" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">22 luglio</text>
<text x="720" y="460" text-anchor="middle" font-size="13" fill="#1d4ed8">il primo movimento arrivato dalla banca</text>

<!-- la banca -->
<rect x="720" y="110" width="430" height="70" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="935" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">I movimenti della banca (Enable Banking)</text>
<text x="935" y="164" text-anchor="middle" font-size="13" fill="#334155">arrivano da soli, a ogni aggiornamento</text>

<!-- il file -->
<rect x="60" y="210" width="1090" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="80" y="236" font-size="16" font-weight="700" fill="#0f172a">Il file della banca (CSV o Excel)</text>
<rect x="70" y="248" width="640" height="32" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="390" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">si aggiungono: i mesi che la banca non ha mai dato</text>
<rect x="730" y="248" width="410" height="32" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="935" y="270" text-anchor="middle" font-size="14" fill="#334155">si saltano: li porta la banca (doppioni)</text>

<!-- le regole -->
<rect x="60" y="480" width="1090" height="66" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="80" y="506" font-size="14" fill="#0f172a"><tspan font-weight="700">Ai bordi:</tspan> una riga dei 3 giorni prima del 22 luglio con lo stesso importo di un movimento della banca è lo stesso movimento</text>
<text x="80" y="530" font-size="14" fill="#0f172a">con una data diversa: si salta. <tspan font-weight="700">Dopo:</tspan> se la banca un giorno desse più storico, riconosce i movimenti presi dal file.</text>
</svg>
