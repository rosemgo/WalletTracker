<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Da un dispositivo remoto a WalletTracker, passo per passo</text>
<text x="600" y="68" text-anchor="middle" font-size="15" fill="#475569">tailscale serve riceve in https e passa alla porta "remota" (8001): mai a quella del server (8000)</text>

<!-- phone -->
<rect x="20" y="100" width="240" height="190" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="140" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Dispositivo remoto</text>
<text x="140" y="156" text-anchor="middle" font-size="12" fill="#334155">browser o app installata:</text>
<text x="140" y="178" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#0f172a">https://pc-casa.</text>
<text x="140" y="196" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#0f172a">tail0000.ts.net</text>
<text x="140" y="224" text-anchor="middle" font-size="12" fill="#334155">① il nome lo trova MagicDNS</text>
<text x="140" y="244" text-anchor="middle" font-size="12" fill="#334155">② controlla il certificato:</text>
<text x="140" y="262" text-anchor="middle" font-size="12" fill="#15803d">🔒 valido (Let's Encrypt)</text>

<line x1="260" y1="195" x2="345" y2="195" stroke="#1d4ed8" stroke-width="4" marker-end="url(#ab)"/>
<text x="302" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">https</text>
<text x="302" y="216" text-anchor="middle" font-size="11" fill="#1d4ed8">dentro il</text>
<text x="302" y="230" text-anchor="middle" font-size="11" fill="#1d4ed8">tunnel</text>
<text x="302" y="244" text-anchor="middle" font-size="11" fill="#1d4ed8">WireGuard</text>

<!-- PC -->
<rect x="350" y="90" width="830" height="560" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="375" y="120" font-size="18" font-weight="700" fill="#334155">Il server (per esempio il PC di casa)</text>

<rect x="370" y="140" width="250" height="230" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="2.5"/>
<text x="495" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#7e22ce">Tailscale: serve</text>
<text x="495" y="194" text-anchor="middle" font-size="12" fill="#334155">③ toglie l'https (ha lui</text>
<text x="495" y="212" text-anchor="middle" font-size="12" fill="#334155">il certificato e la chiave)</text>
<text x="495" y="238" text-anchor="middle" font-size="12" fill="#334155">④ rifà la richiesta in http</text>
<text x="495" y="256" text-anchor="middle" font-size="12" fill="#334155">e aggiunge:</text>
<text x="495" y="280" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#0f172a">Host: pc-casa.tail0000.ts.net</text>
<text x="495" y="298" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#0f172a">X-Forwarded-Proto: https</text>
<text x="495" y="316" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#0f172a">Tailscale-User-Login: …</text>
<text x="495" y="344" text-anchor="middle" font-size="11" fill="#475569">tailscale serve --bg --https=443</text>
<text x="495" y="360" text-anchor="middle" font-size="11" fill="#475569">http://127.0.0.1:8001</text>

<line x1="620" y1="255" x2="700" y2="255" stroke="#475569" stroke-width="3" marker-end="url(#ag)"/>
<text x="660" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">http</text>
<text x="660" y="275" text-anchor="middle" font-size="11" fill="#475569">127.0.0.1:8001</text>

<!-- docker -->
<rect x="705" y="140" width="455" height="490" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="725" y="166" font-size="14" font-weight="700" fill="#334155">Docker</text>

<rect x="725" y="180" width="415" height="210" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
<text x="932" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">nginx, blocco "listen 8081"</text>
<text x="745" y="234" font-size="12" fill="#334155">⑤ Tailscale-Funnel-Request? → 403 (da Internet: mai)</text>
<text x="745" y="258" font-size="12" fill="#334155">⑥ pagine e file di Angular: li dà lui</text>
<text x="745" y="282" font-size="12" fill="#334155">⑦ /api/… → al backend, con:</text>
<text x="765" y="304" font-size="11" font-family="Consolas, monospace" fill="#0f172a">X-WalletTracker-Access: remote</text>
<text x="765" y="322" font-size="11" font-family="Consolas, monospace" fill="#0f172a">X-Forwarded-Proto: https  (da Tailscale)</text>
<text x="765" y="340" font-size="11" font-family="Consolas, monospace" fill="#0f172a">X-Forwarded-Host: (cancellato)</text>
<text x="745" y="368" font-size="12" fill="#475569">la porta 8080 (8000 sul server) Tailscale non la vede</text>

<line x1="932" y1="390" x2="932" y2="425" stroke="#475569" stroke-width="3" marker-end="url(#ag)"/>

<rect x="725" y="430" width="415" height="180" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
<text x="932" y="458" text-anchor="middle" font-size="16" font-weight="700" fill="#c2410c">backend (Tomcat + Spring)</text>
<text x="745" y="486" font-size="12" fill="#334155">⑧ nome consentito? pc-casa.tail0000.ts.net è</text>
<text x="763" y="504" font-size="12" fill="#334155">in WALLETTRACKER_ALLOWED_HOSTS → sì</text>
<text x="745" y="530" font-size="12" fill="#334155">⑨ "remote": serve il PIN (senza PIN non si entra)</text>
<text x="745" y="556" font-size="12" fill="#334155">⑩ PIN giusto → cookie della sessione con Secure</text>
<text x="745" y="582" font-size="12" fill="#334155">⑪ collegare una banca: ritorno su https://pc-casa…/callback</text>

<rect x="370" y="400" width="320" height="230" rx="12" fill="#ffffff" stroke="#94a3b8"/>
<text x="530" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Il browser del server</text>
<text x="530" y="454" text-anchor="middle" font-size="12" fill="#334155">http://localhost:8000</text>
<text x="530" y="474" text-anchor="middle" font-size="12" fill="#334155">→ nginx 8080, "local", come sempre</text>
<line x1="690" y1="465" x2="720" y2="300" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<text x="530" y="508" text-anchor="middle" font-size="12" fill="#334155">Può aprire anche</text>
<text x="530" y="526" text-anchor="middle" font-size="12" fill="#334155">https://pc-casa.tail0000.ts.net:</text>
<text x="530" y="544" text-anchor="middle" font-size="12" fill="#334155">passa da Tailscale, quindi è</text>
<text x="530" y="562" text-anchor="middle" font-size="12" fill="#334155">"remote" e chiede il PIN</text>
<text x="530" y="596" text-anchor="middle" font-size="12" fill="#475569">(il nome conta per i certificati,</text>
<text x="530" y="614" text-anchor="middle" font-size="12" fill="#475569">la porta per "local" o "remote")</text>

<!-- bottom: internet -->
<rect x="20" y="670" width="1160" height="130" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="600" y="700" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">Da Internet, senza Tailscale: niente</text>
<text x="600" y="726" text-anchor="middle" font-size="13" fill="#334155">fuori dalla tua rete Tailscale il nome pc-casa.tail0000.ts.net non porta al server: gli indirizzi 100.x da Internet non si raggiungono.</text>
<text x="600" y="748" text-anchor="middle" font-size="13" fill="#334155">Sul router di casa non c'è nessuna porta aperta. L'unico modo di pubblicarlo su Internet è Tailscale Funnel:</text>
<text x="600" y="770" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">non accenderlo mai. Se succedesse, lo script si ferma e nginx risponde 403 (⑤).</text>
</svg>
