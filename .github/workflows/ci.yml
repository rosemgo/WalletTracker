# Continuous Integration di WalletTracker (spiegata passo passo in docs/11-ci-github-actions.md).
#
# A ogni push (su qualsiasi branch) e a ogni pull request, GitHub prende una macchina virtuale
# Linux nuova, ci scarica il codice, installa Java, compila il backend ed esegue tutti i test.
# Il risultato (✅ o ❌) compare accanto al commit su GitHub, nella scheda "Actions".

name: CI

# Il "trigger": quando far partire la pipeline.
on:
  push:
  pull_request:

# Permessi minimi: la pipeline deve solo leggere il codice, non modificare il repository.
permissions:
  contents: read

jobs:
  # Un "job" è un gruppo di passi eseguiti in ordine sulla stessa macchina.
  # I due job (backend e frontend) girano IN PARALLELO, ognuno sulla sua macchina.
  backend:
    name: Backend (build e test)
    # La macchina su cui girare: Linux (Ubuntu), fornita da GitHub. Ha già Docker, Git e molti altri strumenti.
    runs-on: ubuntu-latest
    # Se qualcosa si blocca, dopo 20 minuti GitHub ferma tutto (di solito bastano 3-4 minuti).
    timeout-minutes: 20

    steps:
      # 1. Scarica il codice del commit appena pubblicato.
      - name: Scarica il codice
        uses: actions/checkout@v7

      # 2. Installa Java 21 (distribuzione Temurin, la stessa che usi sul PC) sulla macchina.
      #    "cache: maven" conserva tra un'esecuzione e l'altra le dipendenze scaricate da Maven,
      #    così le volte successive la build è più veloce.
      - name: Installa Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Compila ed esegue tutti i test. È lo stesso comando che lanci tu (su Linux ./mvnw).
      #    -B ("batch mode") toglie i colori e le barre di avanzamento, che nei log sarebbero illeggibili.
      #    I test di integrazione usano Testcontainers: Docker c'è già sulla macchina di GitHub.
      - name: Compila ed esegui i test
        working-directory: backend
        run: ./mvnw -B verify

      # 4. Solo se qualcosa è andato storto: salva i rapporti dei test come "artefatto",
      #    un file zip scaricabile dalla pagina dell'esecuzione, per capire quale test è fallito e perché.
      - name: Salva i rapporti dei test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapporti-test
          path: backend/target/surefire-reports/

  # La dashboard Angular: stessi principi, ma con Node.js e npm al posto di Java e Maven.
  frontend:
    name: Frontend (build e test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tutti i comandi "run" di questo job partono dalla cartella frontend.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v7

      # Installa Node.js 24 (LTS). "cache: npm" conserva i pacchetti scaricati tra un'esecuzione e l'altra.
      - name: Installa Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "npm ci" installa ESATTAMENTE le versioni scritte in package-lock.json (a differenza di
      # "npm install", che può aggiornarle): in CI vogliamo build ripetibili.
      - name: Installa le dipendenze
        run: npm ci

      # I test girano una volta sola (--watch=false) in un DOM simulato (jsdom): niente browser.
      - name: Esegui i test
        run: npm test -- --watch=false

      # La build di produzione: se il codice o i template hanno errori, fallisce qui.
      - name: Compila
        run: npm run build

  # L'installazione vera (Fase 4, docs/44 e docs/45): lo script installa.sh crea il .env con una password a caso,
  # costruisce le immagini e avvia i container, come sul PC di chi installa. Poi controlliamo che l'app risponda,
  # cambiamo la password del database e ricontrolliamo. Se un Dockerfile, la configurazione di nginx o lo script
  # hanno un errore, ce ne accorgiamo qui. I test girano già nei due job sopra.
  docker:
    name: Installazione con Docker (installa.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v7

      # Sulla macchina di GitHub l'utente ha id 1001, il backend nel container 1000 (docs/45, parte F): la
      # cartella della chiave di cifratura va data all'utente 1000, come farebbe chi installa su un Linux così.
      - name: Prepara le cartelle .data e backup
        run: mkdir .data backup && sudo chown 1000:1000 .data backup

      - name: Installa e avvia
        run: ./installa.sh --senza-browser

      # -f: curl fallisce se la risposta è un errore (4xx, 5xx). Dal passo 3 (docs/46) le API vogliono il PIN: senza,
      # 401. Poi facciamo quello che fa la dashboard: lo stato (che dà il cookie XSRF-TOKEN), il PIN creato dal PC
      # con il gettone CSRF, e le API con la sessione aperta (i cookie restano nel file "biscotti"). La porta 8001 è
      # quella "da un altro dispositivo": lì nginx scrive "remote", anche se chi chiama prova a scrivere "local".
      - name: Controlla che l'app risponda, e che senza PIN le API siano chiuse
        run: |
          curl -fsS http://localhost:8000/ | grep -q '<app-root>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/accounts)" = 401
          curl -fsS http://localhost:8001/api/auth/status | grep -q '"local":false'
          curl -fsS -H 'X-WalletTracker-Access: local' http://localhost:8001/api/auth/status | grep -q '"local":false'
          curl -fsS -c biscotti -b biscotti http://localhost:8000/api/auth/status | grep -q '"local":true'
          gettone=$(awk '$6 == "XSRF-TOKEN" { print $7 }' biscotti)
          curl -fsS -c biscotti -b biscotti -H "X-XSRF-TOKEN: $gettone" -H 'Content-Type: application/json' \
            -d '{"pin":"135792"}' http://localhost:8000/api/auth/pin > risposta.json
          grep -oE '"recoveryCode":"[A-Z0-9-]{19}"' risposta.json | cut -d'"' -f4 > codice
          curl -fsS -b biscotti http://localhost:8000/api/accounts

      # Il PIN dimenticato, "dal telefono" (porta 8001): con il codice di recupero si sceglie un PIN nuovo, si entra,
      # e la sessione aperta prima (biscotti) non vale più.
      - name: Recupera il PIN con il codice, da un altro dispositivo
        run: |
          curl -fsS -c telefono -b telefono http://localhost:8001/api/auth/status > /dev/null
          gettone=$(awk '$6 == "XSRF-TOKEN" { print $7 }' telefono)
          curl -fsS -c telefono -b telefono -H "X-XSRF-TOKEN: $gettone" -H 'Content-Type: application/json' \
            -d "{\"code\":\"$(cat codice)\",\"pin\":\"246810\"}" http://localhost:8001/api/auth/recover | grep -q recoveryCode
          curl -fsS -b telefono http://localhost:8001/api/accounts
          test "$(curl -s -o /dev/null -w '%{http_code}' -b biscotti http://localhost:8000/api/accounts)" = 401

      # Passo 4 (docs/47, parte L). Le intestazioni che Tailscale aggiunge, e quelle false che potrebbe scrivere chiunque.
      - name: Intestazioni di Tailscale e intestazioni false
        run: |
          # Un nome falso (DNS rebinding) resta fuori anche con X-Forwarded-Host: nginx non la fa passare.
          for porta in 8000 8001; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' -H 'X-Forwarded-Host: localhost' \
              http://localhost:$porta/api/auth/status)" = 403
          done
          # Entra con il PIN e stampa il cookie della sessione. $1 = porta, il resto = intestazioni in più.
          entra() {
            porta=$1; shift
            rm -f prova-cookie
            curl -fsS -c prova-cookie -b prova-cookie "$@" http://localhost:$porta/api/auth/status > /dev/null
            gettone=$(awk '$6 == "XSRF-TOKEN" { print $7 }' prova-cookie)
            curl -fsS -D - -o /dev/null -b prova-cookie "$@" -H "X-XSRF-TOKEN: $gettone" \
              -H 'Content-Type: application/json' -d '{"pin":"246810"}' http://localhost:$porta/api/auth/login |
              grep -i '^set-cookie: WALLETTRACKER_SESSION'
          }
          # Dalla porta di Tailscale, con l'https che dice Tailscale: cookie Secure.
          cookie=$(entra 8001 -H 'X-Forwarded-Proto: https')
          echo "$cookie" | grep -q 'Secure'
          # Dalla porta del PC un "https" scritto a mano non conta; e in http, niente Secure. (Non "! grep": con
          # "set -e" una riga che comincia con "!" non fa mai fallire il passo.)
          cookie=$(entra 8000 -H 'X-Forwarded-Proto: https')
          if echo "$cookie" | grep -q 'Secure'; then echo "Secure sulla porta del PC: $cookie"; exit 1; fi
          cookie=$(entra 8001)
          if echo "$cookie" | grep -q 'Secure'; then echo "Secure in http: $cookie"; exit 1; fi
          # Una richiesta arrivata da Internet con Tailscale Funnel: rifiutata, pagine comprese.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Tailscale-Funnel-Request: ?1' http://localhost:8001/)" = 403

      # ./installa.sh --tailscale con un finto "tailscale" (.github/ci/tailscale): il nome del PC e l'indirizzo di
      # ritorno finiscono nel .env, e il backend accetta il nome Tailscale.
      - name: Installazione con --tailscale
        run: |
          PATH="$PWD/.github/ci:$PATH" ./installa.sh --tailscale --senza-browser
          grep -q 'serve --bg --https=443 http://127.0.0.1:8001' .github/ci/serve-chiamato
          grep -q '^WALLETTRACKER_ALLOWED_HOSTS=localhost,127.0.0.1,pc-casa.tail0000.ts.net$' .env
          grep -q '^ENABLE_BANKING_REDIRECT_URL=.*,https://pc-casa.tail0000.ts.net/callback$' .env
          curl -fsS -H 'Host: pc-casa.tail0000.ts.net' http://localhost:8001/api/auth/status | grep -q '"local":false'

      - name: Cambia la password del database e ricontrolla
        run: |
          ./installa.sh --cambia-password-db --senza-browser
          curl -fsS http://localhost:8000/api/auth/status | grep -q '"pinSet":true'

      # Il PIN dimenticato: lo script lo azzera e chiude le sessioni (la vecchia non vale più).
      - name: Azzera il PIN
        run: |
          ./installa.sh --reimposta-pin --senza-browser
          curl -fsS http://localhost:8000/api/auth/status | grep -q '"pinSet":false,"withoutPin":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b telefono http://localhost:8001/api/accounts)" = 401

      # Passo 5 (docs/48, parte L): backup e ripristino, provati davvero. Dati inventati (un PIN e una chiave di
      # Gemini finta, salvata cifrata con la chiave di .data), un backup, poi si cancella TUTTO e si ripristina.
      # I file dei backup sono dell'utente 1000 con permessi 600: per leggerli qui serve sudo.
      - name: Backup
        run: |
          echo 'WALLETTRACKER_BACKUP_PASSWORD=Prova-backup-CI-2026' >> .env
          rm -f prova
          curl -fsS -c prova -b prova http://localhost:8000/api/auth/status > /dev/null
          gettone=$(awk '$6 == "XSRF-TOKEN" { print $7 }' prova)
          curl -fsS -c prova -b prova -H "X-XSRF-TOKEN: $gettone" -H 'Content-Type: application/json' \
            -d '{"pin":"135792"}' http://localhost:8000/api/auth/pin > /dev/null
          curl -fsS -b prova -X PUT -H "X-XSRF-TOKEN: $gettone" -H 'Content-Type: application/json' \
            -d '{"apiKey":"chiave-finta-WXYZ"}' http://localhost:8000/api/ai/keys/GEMINI | grep -q 'WXYZ'
          sudo sha256sum .data/encryption.key | cut -d' ' -f1 > chiave-prima
          ./installa.sh --backup --senza-browser
          file=$(ls backup/wallettracker-manuale-*.backup)
          # Cifrato davvero: comincia con il marchio di OpenSSL, e dentro non c'è niente in chiaro.
          sudo head -c 8 "$file" | grep -q 'Salted__'
          if sudo strings "$file" | grep -q -i -E 'flyway|WXYZ'; then echo "testo in chiaro nel backup"; exit 1; fi
          echo "$file" > backup-da-ripristinare

      - name: Ripristino, dopo aver cancellato il database e la chiave
        run: |
          file=$(cat backup-da-ripristinare)
          docker compose down -v
          sudo rm .data/encryption.key
          ./installa.sh --senza-browser
          curl -fsS http://localhost:8000/api/auth/status | grep -q '"pinSet":false'
          # Con la password sbagliata (e poi Invio vuoto alla domanda): si ferma, e non cambia niente.
          if printf 'RIPRISTINA\n\n' | WALLETTRACKER_BACKUP_PASSWORD=password-sbagliata ./installa.sh --ripristina "$file" --senza-browser; then
            echo "il ripristino con la password sbagliata è riuscito"; exit 1
          fi
          curl -fsS http://localhost:8000/api/auth/status | grep -q '"pinSet":false'
          # Con la password giusta (quella del .env).
          printf 'RIPRISTINA\n' | ./installa.sh --ripristina "$file" --senza-browser
          ls backup/wallettracker-prima-del-ripristino-*.backup
          test "$(sudo sha256sum .data/encryption.key | cut -d' ' -f1)" = "$(cat chiave-prima)"
          curl -fsS http://localhost:8000/api/auth/status | grep -q '"pinSet":true'
          rm -f prova
          curl -fsS -c prova -b prova http://localhost:8000/api/auth/status > /dev/null
          gettone=$(awk '$6 == "XSRF-TOKEN" { print $7 }' prova)
          curl -fsS -c prova -b prova -H "X-XSRF-TOKEN: $gettone" -H 'Content-Type: application/json' \
            -d '{"pin":"135792"}' http://localhost:8000/api/auth/login
          # La chiave di Gemini si legge ancora: il database e la chiave di cifratura sono tornati insieme.
          curl -fsS -b prova http://localhost:8000/api/ai | grep -q '"keyHint":"…WXYZ"'

      - name: Backup automatico
        run: |
          sudo rm -f backup/wallettracker-automatico-*.backup
          echo 'BACKUP_TIME=00:00' >> .env
          docker compose up -d backup
          for i in $(seq 1 40); do
            if ls backup/wallettracker-automatico-*.backup 2> /dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs backup
          exit 1

      # I backup dalla dashboard (docs/48, parte Q): lo stato, "fai un backup adesso", e lo scaricamento solo dal
      # server (porta 8000); da un dispositivo remoto (porta 8001) 403.
      - name: Backup dalla dashboard
        run: |
          entra() {
            rm -f "$2"
            curl -fsS -c "$2" -b "$2" http://localhost:$1/api/auth/status > /dev/null
            gettone=$(awk '$6 == "XSRF-TOKEN" { print $7 }' "$2")
            curl -fsS -c "$2" -b "$2" -H "X-XSRF-TOKEN: $gettone" -H 'Content-Type: application/json' \
              -d '{"pin":"135792"}' http://localhost:$1/api/auth/login
          }
          entra 8000 server
          entra 8001 remoto
          curl -fsS -b server http://localhost:8000/api/backups | grep -q '"serviceRunning":true'
          prima=$(ls backup/wallettracker-manuale-*.backup | wc -l)
          gettone=$(awk '$6 == "XSRF-TOKEN" { print $7 }' server)
          test "$(curl -s -o /dev/null -w '%{http_code}' -b server -X POST -H "X-XSRF-TOKEN: $gettone" \
            http://localhost:8000/api/backups)" = 202
          for i in $(seq 1 20); do
            if [ "$(ls backup/wallettracker-manuale-*.backup | wc -l)" -gt "$prima" ]; then break; fi
            sleep 2
          done
          test "$(ls backup/wallettracker-manuale-*.backup | wc -l)" -gt "$prima"
          nome=$(curl -fsS -b server http://localhost:8000/api/backups | grep -o 'wallettracker-manuale-[0-9-]*\.backup' | head -1)
          curl -fsS -b server -o scaricato.backup "http://localhost:8000/api/backups/$nome"
          sudo cmp scaricato.backup "backup/$nome"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b remoto "http://localhost:8001/api/backups/$nome")" = 403

      # nginx -t controlla la configurazione senza riavviare il server.
      - name: Controlla la configurazione di nginx
        run: docker compose exec -T web nginx -t

      - name: Log dei container
        if: failure()
        run: docker compose logs --tail 200
