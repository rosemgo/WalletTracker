# Il sito di WalletTracker, uguale sulle due porte (docs/44 parte D, docs/46 parte C): lo includono i due blocchi
# server di default.conf. Qui ci sono i file della build, le pagine dell'app, le richieste /api/ al backend, la cache e
# le intestazioni di sicurezza.

server_name _;

# Dove sono i file della build (li copia il Dockerfile).
root /usr/share/nginx/html;
index index.html;

# Non scrivere la versione di nginx nelle risposte e nelle pagine di errore: a chi attacca dice quali
# vulnerabilità provare.
server_tokens off;

# Il file più grande che si può caricare (import CSV). Come max-request-size in application.yml: oltre,
# nginx risponde 413 senza disturbare il backend. Di serie nginx si ferma a 1 MB.
client_max_body_size 6m;

# Compressione: i file di testo (JavaScript, CSS, JSON) viaggiano compressi, molto più leggeri sul telefono.
gzip on;
gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
gzip_min_length 1024;

# --- Il backend ---------------------------------------------------------------------------------------
# "resolver" è il DNS interno di Docker (sempre 127.0.0.11), che trasforma il nome "backend" nell'indirizzo
# del container. Con il nome in una variabile ($backend), nginx lo chiede al DNS a ogni richiesta (al massimo
# ogni 10 secondi) invece che una volta sola all'avvio. Due vantaggi:
#   - nginx parte anche se il backend non è ancora pronto (con il nome scritto direttamente si rifiuterebbe:
#     "host not found in upstream");
#   - se il backend viene ricreato (un aggiornamento) e cambia indirizzo, nginx lo ritrova da solo.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://backend:8080;

location /api/ {
    # Senza un percorso dopo l'indirizzo, la richiesta arriva al backend così com'è: /api/accounts resta
    # /api/accounts.
    proxy_pass $backend;

    # L'header Host che ha usato il browser (es. "localhost" o, con Tailscale, il nome del PC). Senza questa
    # riga nginx manderebbe "backend", e il "buttafuori" del backend (LocalOnlyRequestFilter, docs/17) la
    # rifiuterebbe: "indirizzo backend non consentito". Origin passa da solo, così com'è.
    proxy_set_header Host $host;
    # Da quale porta è entrata la richiesta: "local" (8080, la porta del PC) o "remote" (8081, quella di
    # Tailscale). $wallettracker_access la scrive il blocco server qui sotto (default.conf). proxy_set_header
    # SOSTITUISCE l'header che avesse mandato il browser: chi lo scrivesse a mano non cambierebbe niente.
    # Il backend lo legge in RequestOrigin (docs/46, parte C).
    proxy_set_header X-WalletTracker-Access $wallettracker_access;
    # Chi ha fatto la richiesta: per i log del backend.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Con quale protocollo era arrivato il browser: Tomcat ci crede (forward-headers-strategy: native) e, se è
    # "https", scrive il cookie della sessione con Secure (docs/46 parte G3, docs/47 parte G). Il valore lo
    # decide il blocco server (default.conf): sulla porta del PC è sempre quello vero di nginx; su quella di
    # Tailscale è quello che dice Tailscale, perché l'https lo toglie lui, prima di arrivare qui.
    proxy_set_header X-Forwarded-Proto $wallettracker_proto;
    # Queste due Tomcat le userebbe al posto del nome e della porta veri (server.tomcat.remoteip, di serie in
    # Spring Boot). nginx, di suo, le lascerebbe passare così come le scrive il browser: con
    # "X-Forwarded-Host: localhost" una pagina con un nome falso (DNS rebinding) passerebbe il controllo del
    # nome (LocalOnlyRequestFilter). Un valore vuoto vuol dire, per nginx, "non mandarla" (docs/47, parte H).
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";

    # "Aggiorna ora" e "Prova la connessione" dell'IA possono durare decine di secondi: di serie nginx
    # rinuncia dopo 60. Due minuti bastano e avanzano.
    proxy_read_timeout 120s;

    # Le risposte delle API non si tengono in nessuna cache intermedia (quella del service worker è un'altra
    # cosa, decisa in ngsw-config.json).
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# --- I file della build -------------------------------------------------------------------------------
# Le stesse regole di cache di scripts/serve-dist.mjs. I blocchi "location ~" sono espressioni regolari:
# nginx le prova nell'ordine in cui sono scritte e usa la prima che corrisponde.

# 1. I file con un "hash" nel nome (main-W32IKYYO.js, styles-5INURTSO.css) e i caratteri in media/ non
#    cambiano mai: se cambia il contenuto, cambia il nome. Il browser li può tenere un anno senza chiedere.
#    Se un file così manca, 404 (e non index.html: un .js che è in realtà una pagina HTML romperebbe l'app).
location ~ "(-[A-Za-z0-9_]{8,}\.(js|css)$)|(^/media/)" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# Il manifest della PWA: nginx conosce i tipi dei file dall'estensione (il file mime.types), ma .webmanifest non
# c'è, e lo manderebbe come "application/octet-stream" (dati qualsiasi). default_type vale proprio per le
# estensioni sconosciute. Un blocco "location =" vale solo per quell'indirizzo esatto, e vince sulle
# espressioni regolari.
location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# 2. Gli altri file (hanno un'estensione: ngsw.json, ngsw-worker.js, manifest.webmanifest, le icone):
#    "no-cache" vuol dire "puoi tenerlo, ma chiedi ogni volta se è cambiato". Senza, il telefono non vedrebbe
#    mai una versione nuova dell'app. Se manca, 404.
location ~ "\.[A-Za-z0-9]+$" {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# 3. Tutto il resto sono pagine dell'app (/, /movimenti/12, /callback?code=...): se non c'è un file con quel
#    nome, si manda index.html e il router di Angular mostra la pagina giusta.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
}
