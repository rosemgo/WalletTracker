# La configurazione di nginx per WalletTracker (Fase 4, docs/44 parte D).
#
# nginx fa in produzione quello che durante lo sviluppo fanno ng serve e scripts/serve-dist.mjs:
#   - manda al browser i file della build di Angular (index.html, .js, .css, icone, caratteri);
#   - per un indirizzo come /movimenti/12 manda index.html: le pagine le gestisce il router di Angular;
#   - inoltra le richieste /api/ al backend, che sta in un altro container;
#   - aggiunge le intestazioni di cache e di sicurezza.
#
# Come si legge: "direttiva valore;" (sempre con il punto e virgola) e blocchi { ... }. Il blocco server descrive
# un sito; dentro, i blocchi location dicono che cosa fare per gli indirizzi che corrispondono.
# Per provare una modifica: docker compose build web && docker compose up -d web
# Per controllarla senza riavviare: docker compose exec web nginx -t

# Due porte, lo stesso sito (docs/46, parte C). La differenza è una sola: che cosa nginx scrive al backend
# nell'header X-WalletTracker-Access.
#   8080 → sul PC 127.0.0.1:8000 (WEB_PORT): ci arriva solo chi è sul PC          → "local"
#   8081 → sul PC 127.0.0.1:8001 (REMOTE_PORT): la userà Tailscale (passo 4), per
#          i dispositivi della tua rete privata                                       → "remote"
# Sul PC si possono aprire tutte e due; dal telefono, con Tailscale, solo la seconda. Il backend si fida di "local"
# per due cose sole: creare il PIN, e (se si è scelto "senza PIN") entrare senza.

# Il protocollo da dire al backend per la porta di Tailscale (docs/47, parte G). `tailscale serve` riceve il telefono
# in https, toglie l'https e rifà la richiesta in http verso 127.0.0.1:8001, aggiungendo "X-Forwarded-Proto: https".
# Quindi nginx, che vede solo http ($scheme), qui deve credere a Tailscale. Un "map" è una tabella: se l'intestazione
# in arrivo vale "https", $tailscale_proto vale "https"; qualsiasi altra cosa (o niente) diventa "http". Chi apre
# 127.0.0.1:8001 dal PC e scrive "https" a mano ottiene solo un cookie Secure per sé: non tocca nessun altro.
map $http_x_forwarded_proto $tailscale_proto {
    https   https;
    default http;
}

server {
    listen 8080;
    set $wallettracker_access local;
    # Sulla porta del PC il protocollo è quello vero, visto da nginx: un "https" scritto dal browser non conta.
    set $wallettracker_proto $scheme;
    include /etc/nginx/snippets/wallettracker.conf;
}

server {
    listen 8081;
    set $wallettracker_access remote;
    set $wallettracker_proto $tailscale_proto;

    # Tailscale Funnel pubblica un servizio su Internet, per chiunque: per WalletTracker non va MAI acceso
    # (docs/47, parte F5). Se qualcuno lo accendesse per sbaglio, le richieste da Internet arriverebbero qui con
    # l'intestazione "Tailscale-Funnel-Request" (la scrive Tailscale, e cancella quella che avesse mandato il
    # browser): nginx le rifiuta tutte, pagine comprese. Dalla rete privata (tailscale serve) quell'intestazione
    # non c'è mai.
    if ($http_tailscale_funnel_request) {
        return 403 "WalletTracker non si apre da Internet: spegni Tailscale Funnel: tailscale funnel --https=443 off.\n";
    }

    include /etc/nginx/snippets/wallettracker.conf;
}
