# Le intestazioni di sicurezza (docs/44 parte D, docs/17). Sono in un file a parte, incluso in ogni "location" di
# default.conf, per una regola di nginx che sorprende tutti: se un blocco location ha anche un solo add_header,
# gli add_header scritti nel blocco server NON valgono più lì dentro. Ripeterle a mano in ogni location sarebbe
# facile da dimenticare; con include sono sempre le stesse. "always" le aggiunge anche alle risposte di errore.

# Content-Security-Policy: la lista di ciò che la pagina può caricare ed eseguire. Se un giorno qualcuno riuscisse
# a infilare uno <script> nella pagina (cross-site scripting), il browser si rifiuterebbe di eseguirlo, e non
# potrebbe nemmeno mandare i dati altrove. 'self' = solo dal nostro indirizzo.
#   script-src 'self'          solo i nostri file .js, niente script scritti dentro la pagina;
#   style-src 'unsafe-inline'  Angular mette gli stili dei componenti in tag <style> nella pagina: senza, l'app
#                              resterebbe senza grafica. Gli stili non eseguono codice: il rischio è piccolo;
#   img-src data:              alcune immagini piccole sono scritte dentro il CSS;
#   connect-src 'self'         le chiamate (fetch, il service worker) solo verso le nostre /api;
#   frame-ancestors 'none'     nessun sito può mostrare WalletTracker dentro un suo riquadro (clickjacking);
#   object-src 'none', base-uri 'self', form-action 'self'  chiudono altre strade note.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Il browser non deve "indovinare" il tipo di un file: un .txt resta testo e non diventa uno script.
add_header X-Content-Type-Options "nosniff" always;

# Quando si apre un link verso un altro sito (es. Google AI Studio), non dirgli da quale pagina si arriva: gli
# indirizzi delle nostre pagine possono contenere informazioni (/movimenti/12, /callback?code=...).
add_header Referrer-Policy "no-referrer" always;

# L'app non usa fotocamera, microfono, posizione, pagamenti: li spegniamo del tutto.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Come frame-ancestors, per i browser più vecchi.
add_header X-Frame-Options "DENY" always;
