<div class="shell">
  <nav class="app-nav" aria-label="Sezioni">
    <span class="brand"><span class="brand-mark" aria-hidden="true">W</span>WalletTracker</span>
    @for (section of sections; track section.path) {
      <a
        class="section"
        [routerLink]="section.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="section.icon" /></svg>
        </span>
        <span>{{ section.label }}</span>
      </a>
    }
    <!-- "Altro" serve solo sul telefono: sul PC le sue pagine sono qui sotto, nella colonna. -->
    <a
      class="section more"
      [routerLink]="more.path"
      [class.active]="inMore()"
      [attr.aria-current]="inMore() ? 'page' : null"
    >
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="more.icon" /></svg>
      </span>
      <span>{{ more.label }}</span>
    </a>
    <div class="more-pages">
      @for (page of morePages; track page.path) {
        <a [routerLink]="page.path" routerLinkActive="active" ariaCurrentWhenActive="page">
          {{ page.label }}
        </a>
      }
    </div>
  </nav>

  <div class="page">
    @if (setup.status()?.configured === false) {
      <div class="banner">
        Per iniziare, configura il collegamento con Enable Banking:
        <a routerLink="/impostazioni">apri le Impostazioni</a>.
      </div>
    }

    <main>
      <router-outlet />
    </main>
  </div>
</div>
